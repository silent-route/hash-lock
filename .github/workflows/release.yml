# Pushing a tag such as v1.0.0-beta tests, builds and publishes a release
# with a ready-to-use disk image. Tags with a suffix (-alpha, -beta) are
# marked as pre-releases.
#
# The app is signed with the project's own certificate, from the secrets
# HL_SIGNING_P12 and HL_SIGNING_PASSWORD (see scripts/signing.sh): macOS ties
# Hash Lock's data to it, so every release must carry the same one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Intel: GitHub's Apple Silicon runners are often short of capacity.
    # The app is built for both architectures either way.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && swift --version
      - name: Signing identity present
        env:
          HL_SIGNING_P12: ${{ secrets.HL_SIGNING_P12 }}
        run: '[ -n "$HL_SIGNING_P12" ] || { echo "HL_SIGNING_P12 is not set: a release signed with a new certificate would not open existing vaults" >&2; exit 1; }'
      - name: libsodium
        run: scripts/fetch-libsodium.sh
      - name: Tests
        run: scripts/test.sh
      - name: Build the universal app
        env:
          HL_SIGNING_P12: ${{ secrets.HL_SIGNING_P12 }}
          HL_SIGNING_PASSWORD: ${{ secrets.HL_SIGNING_PASSWORD }}
        run: HL_VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Disk image
        run: scripts/package-release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          # Notes: this version's section of CHANGELOG.md.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Hash Lock $version" > notes.md
          gh release create "$GITHUB_REF_NAME" build/release/* "${pre[@]}" \
            --title "Hash Lock $version" --notes-file notes.md
